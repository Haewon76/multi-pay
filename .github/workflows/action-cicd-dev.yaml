name: Deploy DEV

on:
  push:
    branches: [ "develop" ]  # develop push trigger 시 실행
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  detect-modules:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    # runs-on: [ dev-runner, self-hosted ]
    outputs:
      changed: ${{ steps.changed-mods.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      - name: Determine changed files and modules
        id: changed-mods
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi

          echo "BASE: $BASE_SHA"
          echo "HEAD: $HEAD_SHA"

          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          ALL_MODULES="auth-api gateway payment-api user-api"
          MODULES=""

          for m in $ALL_MODULES; do
            if echo "$CHANGED_FILES" | grep -q "$m/"; then
              MODULES="$MODULES $m"
            fi
          done

          if echo "$CHANGED_FILES" | grep -q "common/"; then
            MODULES="$ALL_MODULES"
          fi

          MODULES=$(echo $MODULES | xargs) # trim
          echo "Changed modules: $MODULES"
          echo "changed=$MODULES" >> $GITHUB_OUTPUT






