dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Explicitly add spring-web with compatible version
    implementation 'org.springframework:spring-web:6.1.5'

    // Auth-specific dependencies
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // Database dependencies
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // Updated JWT dependencies for Java 21 compatibility
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Netty DNS resolver for MacOS
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.107.Final:osx-aarch_64'

    // Common module dependency
    implementation project(':common')
}
